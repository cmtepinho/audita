const fmt=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

let state={screen:'home',month:'Outubro de 2026',selectedCard:'aeternum',files:[{name:'Bradesco Aeternum Outubro 2026.pdf',size:'2,1 MB · 8 páginas',demo:true},{name:'Cartão anterior Outubro 2026.pdf',size:'1,8 MB · 6 páginas',demo:true}],smsMethod:'shortcut',smsFile:false,smsText:'',reviewFilter:'all',statuses:{},transaction:1,reportTab:'Resumo',cardTab:'Todos',extraTab:'Pessoas',overviewTab:'Categoria',modal:'',toast:'',images:{},repay:[500,300],extraName:['Adicional 1','Adicional 2'],returnTo:'review',showExplanation:false,showAllTransactions:false};
const nav=[['home','Início','home'],['start','Nova auditoria','calendar'],['invoices','Faturas','file'],['sms','Mensagens (SMS)','sms'],['processing','Processamento','spark'],['review','Revisão de ocorrências','alert'],['transaction','Detalhe da transação','search'],['wallet','Carteira de cartões','cards'],['additional','Gestão dos adicionais','users'],['report','Relatório mensal','report']];
function go(s){state.screen=s;state.modal='';render();document.getElementById('screen').scrollTop=0;window.scrollTo(0,0);document.getElementById('screen').focus({preventScroll:true})}
function toast(str){state.toast=str;renderToast();setTimeout(()=>{state.toast='';renderToast()},2500)}
function renderToast(){document.getElementById('overlay').innerHTML=state.modal?modalContent():state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}
function setModal(name){state.modal=name;renderToast()}function closeModal(){state.modal='';renderToast()}
function header(title,right=''){return `<div class="top-header"><button class="back" aria-label="Voltar" onclick="go('${['invoices','sms','processing'].includes(state.screen)?'start':state.screen==='transaction'?state.returnTo:'home'}')">${ico('back')}</button><span class="page-title">${title}</span>${right||'<span class="spacer"></span>'}</div>`}
const officialArt={
 'aeternum':'https://assets.bradesco/content/dam/banco-bradesco/principal/conte%C3%BAdo/imagens/cartao-visa-aeternum.png',
 'visa-infinite':'https://assets.bradesco/content/dam/portal-bradesco/html/prime/produtos-servicos/cartoes/assets/images/cards/bradesco-visa-infinite-internacional.png'
};
function cardArt(card,mini=false){
 const customized=state.images[card.id];
 const official=!customized&&officialArt[card.model];
 const src=customized||official;
 const name=card.model==='aeternum'?'Bradesco Aeternum':'Bradesco Visa Infinite';
 const cssClass=customized?'custom-image':card.model==='aeternum'?'aeternum-image':'visa-image';
 const visual=src?`<img class="official-image ${cssClass}" src="${src}" alt="${customized?'Arte personalizada de '+name:'Imagem institucional '+name}" onerror="this.style.display='none'" loading="eager" />`:'';
 if(mini)return `<div class="mini-card-art ${card.theme}"><span class="bank">◒ bradesco</span><span class="tiny">•••• ${card.last}　VISA</span>${visual}</div>`;
 return `<div class="card-top ${card.theme}"><div class="top-row"><div><span class="bank">◒ bradesco</span><div class="brand-detail">${card.model==='aeternum'?'AETERNUM':'VISA INFINITE'}</div></div><span style="font-size:11px;opacity:.8">${esc(card.type)}</span></div><div class="chip"></div><div class="card-bottom"><div><div class="card-name">${esc(card.short)}</div><div class="pan">•••• ${card.last}</div></div><div class="visa">VISA</div></div>${visual}</div>`;
}
function lineButton(title,sub,iconName,fun,color){return `<button class="list-item" onclick="${fun}"><span class="round-icon ${color||''}">${ico(iconName)}</span><span class="li-main"><span class="li-title">${title}</span>${sub?`<div class="li-sub">${sub}</div>`:''}</span><span class="chev">›</span></button>`}
function sec(title,action='',fun=''){return `<div class="section-title"><h3>${title}</h3>${action?`<button class="link" onclick="${fun}">${action} ›</button>`:''}</div>`}
function sectionCategories(compact=false){return `<div class="chart-flex"><div class="donut ${compact?'':'centered'}"><div class="donut-inside">R$ 8.450<span>Total</span></div></div><div class="legend">${categories.map(([n,v,c])=>`<div class="legend-line"><i class="dot" style="background:${c}"></i><span style="overflow:hidden;text-overflow:ellipsis">${n}</span><b>${Math.round(v/8450*100)}%</b></div>`).join('')}</div></div>`}
function home(){const card=cards.find(c=>c.id===state.selectedCard);const pending=issues.filter(i=>!state.statuses[i.id]);return `<div class="topline row between"><div><div class="subtitle">Olá! Sua fatura, sob controle.</div><h2>Meus cartões</h2></div><div class="round-icon" style="background:#0e3d73;color:white;border-radius:50%">P</div></div>
<div class="card-art-top">${cardArt(card)}</div><div class="card-thumbs">${cards.filter(c=>c.id!==card.id).map(c=>`<button class="thumb-button" onclick="state.selectedCard='${c.id}';render()"><div class="row" style="gap:7px">${cardArt(c,true)}<span style="font-size:10px;font-weight:800">${esc(c.short)}<br><span class="muted">${c.last}</span></span></div><div class="thumb-text">${c.status==='Ativo'?'● Ativo':'● Cancelado com parcelas'}</div></button>`).join('')}</div>
${sec('Sua visão de outubro','Ver relatório',"go('report')")}
<div class="card-surface" style="margin-bottom:9px"><div class="row between"><div><div class="subtitle">Total das faturas</div><div class="amount">R$ 8.450,00</div><div class="subtitle">2 faturas · 118 lançamentos</div></div><span class="round-icon">${ico('report',23)}</span></div></div>
<div class="grid3"><button class="metric" style="text-align:left" onclick="go('review')"><span class="subtitle">Auditoria</span><div class="metric-value" style="color:${pending.length?'#e78a23':'#159667'}">${pending.length} para revisar</div></button><button class="metric" onclick="go('report')" style="text-align:left"><span class="subtitle">Conciliação</span><div class="metric-value" style="color:#168e68">94,9%</div></button><button class="metric" onclick="go('additional')" style="text-align:left"><span class="subtitle">Adicionais</span><div class="metric-value">R$ 1.280</div></button></div>
${sec('Ocorrências prioritárias','Ver todas',"go('review')")}${pending.length?`<div class="actions-list">${pending.slice(0,3).map(i=>lineButton(i.type,i.name+' · '+fmt(i.amount),i.level==='high'?'alert':'search',`openIssue(${i.id},'home')`,i.level==='high'?'red':'amber')).join('')}</div>`:`<div class="card-surface row"><span class="round-icon green">${ico('checkCircle')}</span><span class="small">Você revisou todas as ocorrências desta demonstração.</span></div>`}
${sec('Categorias do mês','Ver análise',"go('report');state.reportTab='Categorias';render()")}
<div class="card-surface">${sectionCategories(true)}</div>
<div class="card-surface row between"><div class="row"><span class="round-icon">${ico('calendar')}</span><div><b class="small">Parcelas futuras</b><div class="amount-md">R$ 3.620,00</div><div class="subtitle">24 parcelas em andamento</div></div></div><span class="chev">›</span></div>
<div class="stack"><button class="primary" onclick="go('start')">${ico('plus',15)} &nbsp; Nova auditoria mensal</button><div class="mock" style="text-align:center">Dados demonstrativos. Nenhuma fatura foi processada.</div></div>`}
function start(){return header('Nova auditoria','<button class="link" onclick="go(\'home\')">Cancelar</button>')+`<div class="card-surface row between"><span class="round-icon">${ico('calendar')}</span><div style="flex:1"><div class="micro muted">Mês da auditoria</div><select class="select" style="border:0;padding:4px 0;font-weight:800" onchange="state.month=this.value"><option>Outubro de 2026</option><option>Setembro de 2026</option><option>Novembro de 2026</option></select></div></div><p class="subtitle" style="margin:15px 6px 20px">Vamos analisar todas as faturas e mensagens deste fechamento, mesmo que os cartões tenham datas diferentes.</p><div class="progress-steps">${[['Faturas','Envie todas as faturas do mês.'],['Mensagens (SMS)','Importe o histórico de compras.'],['Revisão e processamento','Verificaremos os documentos antes da análise.'],['Resultado da auditoria','Tudo organizado em um relatório.']].map(([n,d],i)=>`<div class="step ${i===0?'active':''}"><div class="step-num">${i+1}</div><div><h4>${n}</h4><p>${d}</p></div></div>`).join('')}</div><div class="note row"><span>${ico('shield')}</span><div><b>Seus dados são protegidos.</b><br>Este protótipo apenas simula a importação, sem ler ou enviar documentos bancários.</div></div><div class="sticky-btn"><button class="primary" onclick="go('invoices')">Continuar →</button></div>`}
function invoices(){return header('1. Faturas do mês','<button class="link" onclick="go(\'start\')">Cancelar</button>')+`<p class="subtitle">Envie todas as faturas que fazem parte do fechamento de outubro.</p><div class="uploadbox"><span class="round-icon" style="margin:auto">${ico('file')}</span><h3>Adicionar faturas</h3><p>Selecione arquivos PDF emitidos pelo seu banco.</p><label for="pdfFiles">Escolher arquivos</label><input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple hidden onchange="addFiles(event)"></div><div class="subtitle" style="text-align:center;margin:-5px 0 14px">ou selecione usando Arquivos no iPhone</div><div class="divider"></div>${sec('Faturas adicionadas')}<div id="files-list">${state.files.map((f,j)=>`<div class="file-row"><span class="round-icon">${ico('file')}</span><div class="name">${esc(f.name)}<div class="meta">${esc(f.size)} · ${f.demo?'Exemplo fictício':'Selecionado, não processado'}</div></div><button class="remove" aria-label="Remover arquivo" onclick="removeFile(${j})">×</button></div>`).join('')}</div><div class="note" style="margin-top:18px"><b>Importante</b><br>Arquivos escolhidos nesta demonstração são apenas listados. A leitura e identificação automática dos lançamentos serão desenvolvidas depois.</div><div class="sticky-btn"><button class="primary" onclick="go('sms')">Continuar →</button></div>`}
function sms(){return header('2. Mensagens (SMS)','<button class="link" onclick="go(\'start\')">Cancelar</button>')+`<p class="subtitle">O histórico de mensagens ajuda a conciliar as compras e reconhecer os estabelecimentos.</p><div class="segmented" style="margin:17px 0"><button class="${state.smsMethod==='shortcut'?'active':''}" onclick="state.smsMethod='shortcut';render()">Atalhos do iPhone</button><button class="${state.smsMethod==='file'?'active':''}" onclick="state.smsMethod='file';render()">Arquivo ou texto</button></div>${state.smsMethod==='shortcut'?`<div class="card-surface"><div class="row"><span class="round-icon">${ico('sms')}</span><b class="small">Importar pelo Atalhos do iPhone</b></div><div class="progress-steps" style="margin:17px 0 5px">${[['1','Configure o atalho na versão real.'],['2','Selecione as mensagens do banco.'],['3','Autorize a exportação dos dados.']].map(([n,v])=>`<div class="row" style="margin-bottom:12px"><span class="badge blue">${n}</span><span class="subtitle">${v}</span></div>`).join('')}</div><button class="primary" onclick="toast('Integração com Atalhos será testada em etapa posterior.')">Testar Atalho do iPhone</button><div class="subtitle" style="text-align:center;margin-top:8px">Integração ainda não disponível</div></div>`:`<div class="card-surface"><div class="row"><span class="round-icon">${ico('upload')}</span><b class="small">Enviar arquivo ou colar mensagens</b></div><p class="subtitle">Selecione um arquivo TXT/CSV ou cole mensagens de exemplo. Os dados não são processados.</p><label class="outline" for="smsFiles" style="display:block;text-align:center;cursor:pointer">${state.smsFile?'Arquivo selecionado':'Escolher arquivo TXT/CSV'}</label><input id="smsFiles" type="file" accept=".txt,.csv,text/plain,text/csv" hidden onchange="state.smsFile=this.files.length>0;toast('Arquivo selecionado para demonstração.')"><textarea class="input" style="min-height:125px;margin-top:12px;resize:vertical" placeholder="Cole aqui mensagens de exemplo (sem dados sensíveis)..." oninput="state.smsText=this.value">${esc(state.smsText)}</textarea></div>`}<div class="note"><b>Dica importante</b><br>Parcelas podem ter sido compradas meses atrás. A versão real utilizará o histórico anterior e não exigirá o mesmo SMS todo mês.</div><div class="sticky-btn"><button class="primary" onclick="go('processing')">Continuar →</button></div>`}
function processing(){return header('3. Análise inteligente')+`<div class="center-empty"><span class="round-icon" style="width:67px;height:67px;border-radius:20px;margin:auto">${ico('spark',32)}</span><h3>Pronto para a auditoria</h3><p>Esta etapa demonstrará como o motor irá verificar as fontes e apresentar as pendências, sem analisar os seus arquivos reais.</p></div><div class="card-surface"><div class="note-head">Prévia das verificações</div>${[['file','Integridade das faturas'],['refresh','Conciliação de SMS e parcelas'],['alert','Duplicidades e possíveis irregularidades'],['search','Estabelecimentos e categorias'],['users','Cartões adicionais e responsáveis']].map(([ic,n])=>`<div class="tableline"><span class="row"><span style="color:#1263c5">${ico(ic,16)}</span>${n}</span><span style="color:#159667">${ico('checkCircle',17)}</span></div>`).join('')}</div><div class="help">${ico('shield',18)} <span>Dados de teste consistentes: 2 faturas, 118 lançamentos, 5 ocorrências demonstrativas. Uma compra conciliada não significa compra autorizada.</span></div><div class="sticky-btn"><button class="primary" onclick="go('review');toast('Auditoria de demonstração preparada!')">Ver auditoria simulada →</button></div>`}
function review(){const pending=issues.filter(i=>!state.statuses[i.id]),high=pending.filter(i=>i.level==='high'),normal=pending.filter(i=>i.level!=='high'),filtered=issues.filter(i=>state.reviewFilter==='all'||(state.reviewFilter==='high'&&i.level==='high'&&!state.statuses[i.id])||(state.reviewFilter==='review'&&i.level!=='high'&&!state.statuses[i.id])||(state.reviewFilter==='resolved'&&state.statuses[i.id]));return header('Revisão de ocorrências',`<button class="back" onclick="setModal('filters')">${ico('filter')}</button>`)+`<div class="card-surface" style="padding:12px"><div class="row between"><div class="row" style="gap:17px"><div style="text-align:center"><div class="amount-md" style="color:#d53c4e">${high.length}</div><div class="micro muted">Prioridade alta</div></div><div style="text-align:center"><div class="amount-md" style="color:#d98e22">${normal.length}</div><div class="micro muted">Para revisar</div></div><div style="text-align:center"><div class="amount-md" style="color:#168e68">${issues.length-pending.length}</div><div class="micro muted">Resolvidas</div></div></div></div><div class="categorybar"><span style="width:100%;background:linear-gradient(90deg,#db4150 0% ${high.length/5*100}%,#ecab37 ${high.length/5*100}% ${(high.length+normal.length)/5*100}%,#28ac78 ${(high.length+normal.length)/5*100}% 100%)"></span></div></div><div class="filter-pills">${[['all','Todas ('+issues.length+')'],['high','Prioridade alta ('+high.length+')'],['review','Para revisar ('+normal.length+')'],['resolved','Resolvidas ('+(issues.length-pending.length)+')']].map(([k,n])=>`<button class="${state.reviewFilter===k?'active':''}" onclick="state.reviewFilter='${k}';render()">${n}</button>`).join('')}</div>${filtered.length?filtered.map(i=>`<div class="issue ${state.statuses[i.id]?'resolved':i.level==='high'?'':'amber'}" onclick="openIssue(${i.id},'review')"><div class="row" style="align-items:flex-start"><span class="round-icon ${state.statuses[i.id]?'green':i.level==='high'?'red':'amber'}">${ico(state.statuses[i.id]?'checkCircle':i.level==='high'?'alert':'search',18)}</span><div class="left"><div class="row between" style="gap:5px;align-items:start"><span class="issue-title">${esc(state.statuses[i.id]?'Revisada · '+i.type:i.type)}</span><span class="money">${fmt(i.amount)}</span></div><div class="strong small" style="margin-top:3px">${esc(i.name)}</div><p>${esc(i.detail)}</p><span class="meta-chip">Final ${i.card}</span><span class="meta-chip">${i.date}</span></div><span class="chev">›</span></div></div>`).join(''):`<div class="center-empty"><span class="round-icon green" style="margin:auto">${ico('checkCircle')}</span><h3>Nada nessa categoria</h3><p>Explore outra categoria ou volte ao relatório.</p></div>`}<button class="outline" onclick="state.reportTab='Resumo';go('report')">${ico('report',15)} &nbsp; Ver relatório completo</button><div class="subtitle" style="text-align:center;margin:12px 0">113 transações ilustrativas sem pendência individual</div>`}
function openIssue(id,from='review'){state.transaction=id;state.returnTo=from;go('transaction')}
function markIssue(type){state.statuses[state.transaction]=type;render();toast(type==='unknown'?'Compra marcada como não reconhecida (simulação).':'Sua decisão foi registrada nesta demonstração.')}
function transaction(){const i=issues.find(x=>x.id===state.transaction),s=state.statuses[i.id];return header('Detalhes da transação',`<button class="back" onclick="setModal('explain')">${ico('settings')}</button>`)+`<div class="card-surface" style="border-color:${i.level==='high'?'#f5d6da':'#f2dfbf'};background:#fffafb"><div class="row"><span class="round-icon ${i.level==='high'?'red':'amber'}">${ico('alert')}</span><div><b class="small">${esc(i.type)}</b><div class="subtitle">${esc(i.detail)}</div></div></div></div><div class="card-surface"><div class="row between"><div><div class="page-title">${esc(i.name)}</div><div class="subtitle">${esc(i.social)}</div></div><span class="round-icon">${ico('tag')}</span></div><div class="row" style="margin-top:12px"><span class="badge blue">${esc(i.cat)}</span><span class="badge ${s?'':'amber'}">${s?'Revisada':'Para revisar'}</span></div><div class="amount" style="margin:14px 0 3px">${fmt(i.amount)}</div><div class="subtitle">${i.date} · Outubro 2026</div><div class="divider"></div><div class="row between"><div class="row">${cardArt(cards.find(c=>c.last===i.card)||cards[0],true)}<div><b class="small">Cartão final ${i.card}</b><div class="subtitle">${cards.find(c=>c.last===i.card)?.short||'Cartão'}</div></div></div><span class="chev">›</span></div></div>${sec('Evidências')}${lineButton('Mensagem SMS','Ver texto importado do banco','sms',"setModal('evidenceSms')")}${lineButton('Lançamento na fatura','Ver origem da cobrança','file',"setModal('evidenceBill')")}<div class="card-surface" style="margin-top:12px"><div class="row between"><b class="small">Conciliação e reconhecimento</b><span class="badge grey">Etapas diferentes</span></div><div class="tableline"><span>Registros conciliados</span><b>Em análise</b></div><div class="tableline"><span>Autorização pelo titular</span><b>${s==='recognized'?'Reconhecida':s==='unknown'?'Não reconhecida':'Não confirmada'}</b></div><div class="tableline"><span>Categoria</span><b>${esc(i.cat)}</b></div></div>${s?`<div class="note">Esta ocorrência já tem uma decisão: <b>${esc(s)}</b>. Você pode alterá-la se necessário.</div>`:''}<div class="grid2" style="margin-top:14px"><button class="primary" style="background:#149768" onclick="markIssue('recognized')">${ico('check',15)} &nbsp; Reconheço</button><button class="outline danger-outline" onclick="markIssue('unknown')">Não reconheço</button></div><div style="display:grid;gap:8px;margin-top:9px"><button class="outline" onclick="setModal('resolve')">Corrigir ou explicar ocorrência</button><button class="subtle-btn" style="padding:8px" onclick="go('${state.returnTo}')">← Voltar às ocorrências</button></div>`}
function wallet(){let selected=cards.find(c=>c.id===state.selectedCard);let filtered=cards.filter(c=>state.cardTab==='Todos'||(state.cardTab==='Titular'&&c.type==='Titular'&&c.status==='Ativo')||(state.cardTab==='Adicionais'&&c.type==='Adicional')||(state.cardTab==='Cancelados'&&c.status!=='Ativo'));return `<div class="topline row between"><h2>Meus cartões</h2><button class="round-icon" style="border:0;background:#0c5ad0;color:white" onclick="setModal('newCard')">${ico('plus')}</button></div><div class="tabs">${['Todos','Titular','Adicionais','Cancelados'].map(t=>`<button class="${state.cardTab===t?'active':''}" onclick="chooseCardTab('${t}')">${t}</button>`).join('')}</div><div class="card-art-top">${cardArt(selected)}</div>${!state.images[selected.id]?'<div class="mock" style="text-align:center;margin-top:-2px;margin-bottom:6px">Arte institucional do modelo. É necessária conexão para carregar a imagem.</div>':''}<div class="row between" style="margin:13px 1px"><div><div class="page-title">${esc(selected.name)}</div><div class="subtitle">•••• ${selected.last} · ${selected.type}</div></div><span class="badge ${selected.status==='Ativo'?'':'amber'}">${selected.status}</span></div><div class="card-thumbs">${filtered.map(c=>`<button class="thumb-button ${state.selectedCard===c.id?'selected':''}" onclick="state.selectedCard='${c.id}';render()">${cardArt(c,true)}<div class="thumb-text"><b>${esc(c.short)}</b><br>•••• ${c.last}</div></button>`).join('')}</div>${sec('Resumo deste cartão')}<div class="card-surface"><div class="grid2"><div><div class="subtitle">Referência de fatura</div><div class="amount-md">${fmt(selected.total)}</div><div class="subtitle">Dados fictícios</div></div><div><div class="subtitle">Parcelas futuras</div><div class="amount-md">${fmt(selected.future)}</div><div class="subtitle">Estimativa ilustrativa</div></div></div><div class="divider"></div>${lineButton('Personalizar imagem','Escolha uma foto frontal do cartão, sem dados sensíveis','upload',"uploadCardImage()")}${lineButton('Histórico de faturas','Consultar demonstração do relatório','file',"go('report')")}${selected.type==='Adicional'?lineButton('Gestão do adicional','Compras e repasses simulados','users',"go('additional')"):lineButton('Configurações do cartão','Status e identificação','settings',"setModal('cardSettings')")}</div><div class="help">${ico('shield',18)} <span>Imagens personalizadas são mantidas apenas nesta sessão do navegador. Não fotografe o verso ou números completos de cartões.</span></div>`}
function chooseCardTab(t){state.cardTab=t;let filtered=cards.filter(c=>t==='Todos'||(t==='Titular'&&c.type==='Titular'&&c.status==='Ativo')||(t==='Adicionais'&&c.type==='Adicional')||(t==='Cancelados'&&c.status!=='Ativo'));if(!filtered.some(c=>c.id===state.selectedCard))state.selectedCard=filtered[0]?.id||'aeternum';render()}
function uploadCardImage(){document.getElementById('card-image').click()}
document.getElementById('card-image').addEventListener('change',function(){const f=this.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Selecione uma imagem.');return}let reader=new FileReader();reader.onload=()=>{state.images[state.selectedCard]=reader.result;render();toast('Imagem aplicada somente nesta sessão.')};reader.readAsDataURL(f)});
function additional(){const totals=[820,460];return header('Cartões adicionais',`<button class="back" onclick="setModal('newAdditional')">${ico('plus')}</button>`)+`<div class="card-surface"><div class="subtitle">Total de compras dos adicionais</div><div class="amount">R$ 1.280,00</div><div class="subtitle">Outubro de 2026 · Exemplo</div></div><div class="grid3">${[['Compras',1280,'#153451'],['Recebido',state.repay[0]+state.repay[1],'#168e69'],['A receber',1280-state.repay[0]-state.repay[1],'#de6e17']].map(([n,v,c])=>`<div class="metric"><div class="micro muted">${n}</div><div class="metric-value" style="color:${c};font-size:15px">${fmt(v)}</div></div>`).join('')}</div><div class="segmented" style="margin:16px 0">${[['Pessoas','Pessoas'],['Cartões','Cartões'],['Histórico','Histórico']].map(([k,v])=>`<button class="${state.extraTab===k?'active':''}" onclick="state.extraTab='${k}';render()">${v}</button>`).join('')}</div>${state.extraTab==='Pessoas'?totals.map((v,j)=>`<div class="card-surface"><div class="row between"><div class="row"><span class="round-icon">${ico('user')}</span><div><b class="small">${esc(state.extraName[j])}</b><div class="subtitle">Cartão final ${cards[j+2].last}</div></div></div><span class="chev">›</span></div><div class="grid3" style="margin:13px 0"><div><div class="micro muted">Compras</div><b class="small">${fmt(v)}</b></div><div><div class="micro muted">Recebido</div><b class="small" style="color:#15976b">${fmt(state.repay[j])}</b></div><div><div class="micro muted">A receber</div><b class="small" style="color:#d87723">${fmt(v-state.repay[j])}</b></div></div><div class="categorybar"><span style="width:${Math.min(100,state.repay[j]/v*100)}%;background:linear-gradient(90deg,#2188ed,#0755cc)"></span></div><div class="row between"><div class="subtitle">${Math.round(state.repay[j]/v*100)}% recebido</div><button class="link" onclick="state.modal='repay${j}';renderToast()">Registrar repasse +</button></div><div class="divider"></div><button class="outline" onclick="setModal('additionalDetail${j}')">Ver compras e parcelas →</button></div>`).join(''):state.extraTab==='Cartões'?cards.filter(c=>c.type==='Adicional').map(c=>lineButton(c.short,'Final '+c.last+' · '+fmt(c.total),'cards',`state.selectedCard='${c.id}';go('wallet')`)).join(''):`<div class="card-surface"><b class="small">Registro de repasses</b><div class="tableline"><span>Adicional 1 · exemplo</span><b>R$ 500,00</b></div><div class="tableline"><span>Adicional 2 · exemplo</span><b>R$ 300,00</b></div><p class="subtitle">Repasses adicionais registrados nesta sessão atualizam os saldos simulados.</p></div>`}<div class="note">Os valores dos adicionais já fazem parte das faturas consolidadas. Não são somados novamente ao total.</div>`}
function report(){let pending=issues.filter(i=>!state.statuses[i.id]);return header('Auditoria de outubro',`<button class="back" onclick="setModal('export')">${ico('download')}</button>`)+`<div class="subtitle" style="text-align:center;margin-top:-13px;margin-bottom:10px">01/10 a 31/10/2026 · Dados demonstrativos</div><div class="tabs">${['Resumo','Lançamentos','Categorias','Adicionais'].map(t=>`<button class="${state.reportTab===t?'active':''}" onclick="state.reportTab='${t}';render()">${t}</button>`).join('')}</div>${state.reportTab==='Resumo'?`<div class="report-summary"><div class="row between"><div><div class="subtitle">Resumo de outubro</div><div class="amount">R$ 8.450,00</div><div class="subtitle">2 faturas · 118 lançamentos</div></div><div style="text-align:right"><span class="badge ${pending.length?'amber':'green'}">${pending.length?'Revisão pendente':'Revisada'}</span><div class="small" style="margin-top:8px">94,9% conciliados</div><div class="categorybar" style="width:100px"><span style="width:94.9%;background:#18a36e"></span></div></div></div></div><div class="card-surface">${sec('Ocorrências','Ver todas',"go('review')")}<div class="grid3">${[['Alta',pending.filter(i=>i.level==='high').length,'#cc334a'],['Revisar',pending.filter(i=>i.level!=='high').length,'#dd8e28'],['Resolvidas',5-pending.length,'#169b6b']].map(([n,v,c])=>`<div class="metric" style="text-align:center;padding:9px 4px"><div class="amount-md" style="color:${c}">${v}</div><div class="micro muted">${n}</div></div>`).join('')}</div></div>${sec('Visão financeira','Categorias',"state.reportTab='Categorias';render()") }<div class="card-surface">${sectionCategories()}</div><div class="grid2"><div class="card-surface" style="padding:12px"><b class="small">Por cartão</b><div class="tableline"><span>Aeternum</span><b>R$ 7.200</b></div><div class="tableline"><span>Anterior</span><b>R$ 1.250</b></div></div><div class="card-surface" style="padding:12px"><b class="small">Adicionais</b><div class="amount-md" style="margin:8px 0">R$ 1.280</div><div class="subtitle">${fmt(1280-state.repay[0]-state.repay[1])} a receber</div><button class="link" onclick="go('additional')">Detalhes →</button></div></div>${lineButton('Integridade dos documentos','Totais de 2 faturas fictícias conferidos no conjunto de demonstração','checkCircle',"setModal('integrity')",'green')}${lineButton('Raio-X dos estabelecimentos','Padrões, recorrências e classificações','search',"setModal('merchants')")}`:state.reportTab==='Lançamentos'?`${sec('Ocorrências do mês','Revisar',"go('review')")}${issues.map(i=>lineButton(i.name,esc(i.type)+' · Final '+i.card+' · '+fmt(i.amount),i.level==='high'?'alert':'tag',`openIssue(${i.id},'report')`,i.level==='high'?'red':'amber')).join('')}<div class="note" style="margin-top:12px">Esta lista demonstra 5 lançamentos com ocorrências. Os outros lançamentos são agregados e fictícios.</div>`:state.reportTab==='Categorias'?`${sec('Por categoria')}<div class="card-surface">${sectionCategories()}</div><div class="card-surface">${categories.map(([n,v,c])=>`<div style="margin-bottom:9px"><div class="row between small"><span>${n}</span><b>${fmt(v)}</b></div><div class="categorybar"><span style="background:${c};width:${v/8450*100}%"></span></div></div>`).join('')}</div><div class="help">${ico('tag',16)} <span>As categorias são sugestões e podem ser corrigidas no detalhe da compra.</span></div>`:`${sec('Por responsável')}<div class="card-surface"><div class="tableline"><span>Titular</span><b>R$ 7.170,00</b></div><div class="tableline"><span>Adicional 1</span><b>R$ 820,00</b></div><div class="tableline"><span>Adicional 2</span><b>R$ 460,00</b></div><div class="divider"></div><div class="row between"><b class="small">A receber dos adicionais</b><b style="color:#cf7d22">${fmt(1280-state.repay[0]-state.repay[1])}</b></div></div><button class="primary" onclick="go('additional')">Gerenciar repasses →</button>`}`}
function modalContent(){let m=state.modal;let i=issues.find(x=>x.id===state.transaction);let content='';if(m==='evidenceSms')content=`<h3>Mensagem SMS</h3><p>Registro ilustrativo utilizado para verificar a correspondência.</p><div class="receipt">${esc(i.sms)}</div><div class="note" style="margin-top:12px">A mensagem não confirma que a compra foi autorizada pelo titular.</div>`;else if(m==='evidenceBill')content=`<h3>Lançamento na fatura</h3><p>Trecho demonstrativo de uma fatura.</p><div class="receipt">${esc(i.bill)}</div>`;else if(m==='resolve')content=`<h3>Resolver ocorrência</h3><p>Selecione a conclusão após verificar os registros.</p><div class="stack"><button class="outline" onclick="closeModal();markIssue('expected')">É uma cobrança esperada / explicada</button><button class="outline" onclick="closeModal();markIssue('duplicate-confirmed')">Confirmei a cobrança duplicada</button><button class="outline" onclick="closeModal();markIssue('identified')">Identifiquei o estabelecimento</button><button class="outline" onclick="closeModal();markIssue('assigned')">Identifiquei o responsável</button></div>`;else if(m.startsWith('repay')){let j=Number(m.replace('repay',''));content=`<h3>Registrar repasse</h3><p>Simulação de recebimento de ${esc(state.extraName[j])}. Saldo atual: ${fmt([820,460][j]-state.repay[j])}.</p><label class="field-label">Valor recebido (R$)</label><input class="input" id="repay-value" type="number" min="0.01" step="0.01" placeholder="Ex.: 100,00"><div style="height:12px"></div><button class="primary" onclick="saveRepay(${j})">Salvar recebimento</button>`;}else if(m.startsWith('additionalDetail')){let j=Number(m.replace('additionalDetail',''));content=`<h3>${esc(state.extraName[j])}</h3><p>Cartão final ${cards[j+2].last} · Lançamentos e parcelas ilustrativos</p><div class="key-value"><span>Compras do mês</span><b>${fmt([820,460][j])}</b></div><div class="key-value"><span>Parcelas futuras</span><b>${fmt([1180,620][j])}</b></div><div class="key-value"><span>A receber</span><b>${fmt([820,460][j]-state.repay[j])}</b></div>`;}else if(m==='export')content=`<h3>Exportar relatório</h3><p>É possível gerar um resumo fictício local em arquivo texto. Exportação profissional em PDF será implementada após validação do motor real.</p><button class="primary" onclick="downloadSummary()">Exportar resumo demonstrativo</button>`;else if(m==='cardSettings')content=`<h3>Configurações do cartão</h3><p>Os dados de exemplo são fixos neste protótipo. Você pode personalizar a imagem frontal para visualizar a carteira.</p><button class="primary" onclick="closeModal();uploadCardImage()">Alterar imagem do cartão</button>`;else if(m==='integrity')content=`<h3>Integridade dos documentos</h3><p>O resultado apresentado é uma simulação baseada em dados fictícios coerentes, não uma análise dos PDFs escolhidos.</p><div class="note">Na versão real, verificaremos páginas lidas, totais, créditos, estornos, parcelas e origem dos lançamentos.</div>`;else if(m==='merchants')content=`<h3>Raio-X dos estabelecimentos</h3><p>O motor inteligente identificará nomes comerciais, recorrências, razão social quando verificável e categoria sugerida.</p><div class="key-value"><span>Supermercado Tauste</span><b>Supermercado</b></div><div class="key-value"><span>Spotify</span><b>Assinaturas</b></div><div class="key-value"><span>MJ*8F7A2D</span><b>Sem identificação confiável</b></div>`;else if(m==='explain')content=`<h3>Histórico de decisões</h3><p>Este protótipo registra as decisões apenas nesta sessão. O produto real terá rastreabilidade de origem, data e pessoa responsável.</p><div class="note">Nenhuma ação neste protótipo contesta ou bloqueia uma compra junto ao banco.</div>`;else if(m==='filters')content=`<h3>Filtros de revisão</h3><p>Você pode filtrar por prioridade e situação.</p>${[['all','Todas'],['high','Prioridade alta'],['review','Para revisar'],['resolved','Resolvidas']].map(([k,n])=>`<button class="list-item" onclick="state.reviewFilter='${k}';closeModal();render()">${n} <span style="margin-left:auto">${state.reviewFilter===k?'✓':'›'}</span></button>`).join('')}`;else if(m==='newCard'||m==='newAdditional')content=`<h3>${m==='newCard'?'Adicionar cartão':'Adicionar adicional'}</h3><p>Cadastro ilustrativo. Na versão funcional será possível criar, editar e vincular cartões a pessoas e faturas.</p><div class="note">Mantenha apenas os quatro cartões fictícios para preservar a consistência desta demonstração.</div>`;else content='<h3>Informações</h3>';return `<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="modal-close" aria-label="Fechar" onclick="closeModal()">${ico('close',16)}</button>${content}</div></div>`}
function saveRepay(j){let el=document.getElementById('repay-value'),val=Number(el.value);if(!Number.isFinite(val)||val<=0||val>([820,460][j]-state.repay[j])+0.001){toast('Informe um valor positivo até o saldo restante.');return}state.repay[j]+=val;closeModal();render();toast('Repasse registrado somente na demonstração.')}
function downloadSummary(){let lines=['AUDITA - RELATORIO DEMONSTRATIVO','Outubro 2026','2 faturas - R$ 8.450,00','118 lancamentos, 112 conciliados','5 ocorrencias ilustrativas','',...issues.map(i=>`${i.name}: ${fmt(i.amount)} - ${i.type} - ${state.statuses[i.id]||'pendente'}`),'','Dados ficticios. Nao substitui auditoria bancaria.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audita_relatorio_demonstrativo.txt';a.click();URL.revokeObjectURL(a.href);closeModal()}
function addFiles(e){let added=[...e.target.files].filter(f=>f.name.toLowerCase().endsWith('.pdf')).map(f=>({name:f.name,size:(f.size/1024/1024).toFixed(1).replace('.',',')+' MB · Não analisado',demo:false}));state.files.push(...added);render();toast(added.length?'Arquivos selecionados; leitura simulada.':'Nenhum PDF selecionado.')}
function removeFile(i){state.files.splice(i,1);render()}
function resetDemo(){const i=state.images;state={...state,screen:'home',selectedCard:'aeternum',reviewFilter:'all',statuses:{},files:[{name:'Bradesco Aeternum Outubro 2026.pdf',size:'2,1 MB · 8 páginas',demo:true},{name:'Cartão anterior Outubro 2026.pdf',size:'1,8 MB · 6 páginas',demo:true}],smsMethod:'shortcut',smsFile:false,smsText:'',reportTab:'Resumo',cardTab:'Todos',extraTab:'Pessoas',repay:[500,300],modal:'',toast:'',images:i};render();toast('Demonstração reiniciada.')}
function render(){const map={home, start,invoices,sms,processing,review,transaction,wallet,additional,report};document.getElementById('screen').dataset.view=state.screen;document.getElementById('screen').innerHTML='<div class="view-content">'+map[state.screen]()+'</div>';const footer=[['home','Início','home'],['report','Auditorias','report'],['wallet','Cartões','cards'],['additional','Adicionais','users']].map(([k,n,ic])=>`<button class="${state.screen===k?'active':''}" onclick="go('${k}')">${ico(ic)}<span>${n}</span></button>`).join('');document.getElementById('bottom').innerHTML=footer?`<nav class="bottom" aria-label="Navegação principal">${footer}</nav>`:'';document.getElementById('desk-nav').innerHTML=nav.filter(([s])=>!['sms','processing','transaction'].includes(s)).map(([s,n,ic])=>`<button class="${state.screen===s?'active':''}" onclick="go('${s}')">${ico(ic,17)}${n}</button>`).join('');renderToast()}
window.AuditaPrototype={state,ui:{esc,fmt,ico,header,sec,cardArt,lineButton},install(views){
 home=views.home;start=views.start;invoices=views.invoices;sms=views.sms;processing=views.processing;
 review=views.review;transaction=views.transaction;wallet=views.wallet;additional=views.additional;report=views.report;
 modalContent=views.modalContent;addFiles=views.addFiles;removeFile=views.removeFile;markIssue=views.markIssue;
 downloadSummary=views.downloadSummary;resetDemo=views.resetDemo;
}};
document.getElementById('screen').innerHTML='<div class="center-empty"><h3>Preparando seu Audita…</h3><p>Seus dados permanecem neste dispositivo.</p></div>';
</script><script type="module" src="assets/app.js"></script></body></html>
